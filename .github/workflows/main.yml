name: Build Android Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Unpack project.zip (if present)
        run: |
          if [ -f project.zip ]; then
            rm -rf _unpacked
            mkdir _unpacked
            unzip -q project.zip -d _unpacked
            echo "Unpacked project.zip"
          else
            echo "No project.zip, using repo files as they are"
          fi

      - name: Locate Android project
        id: proj
        run: |
          if [ -d _unpacked ]; then search=_unpacked; else search=.; fi
          f=$(find "$search" -name settings.gradle.kts -not -path '*/.git/*' | head -n1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts not found. Repo contents:"
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          echo "Project dir: $(dirname "$f")"
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Check project files
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml app/src/main/java/com/firdaus/stickerai/MainActivity.kt app/src/main/res/values/styles.xml; do
            if [ -s "$f" ]; then echo "OK      $f"; else echo "MISSING $f"; missing=1; fi
          done
          [ -z "$missing" ] || { echo "Some project files are missing."; exit 1; }

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: FirdausStickerAI-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
